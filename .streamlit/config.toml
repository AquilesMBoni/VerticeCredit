[server]
enableStaticServing = true
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
font = "Inter, system-ui, sans-serif"
headingFont = "Sora, Inter, system-ui, sans-serif"
baseRadius = "0.75rem"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Sora"
url = "app/static/fonts/sora.woff2"
weight = "100 800"

# Paletas nativas: usadas no modo "Automático" (segue o sistema operacional)
[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#eaf0f7"
secondaryBackgroundColor = "#dde6f1"
textColor = "#12213a"
borderColor = "#c9d5e4"

[theme.dark]
primaryColor = "#5598e7"
backgroundColor = "#0c1424"
secondaryBackgroundColor = "#16223a"
textColor = "#e8eef8"
borderColor = "#25344f"
