[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vertice-credit-analytics"
version = "1.0.0"
description = "Pipeline de análise de risco de crédito: qualidade, limpeza, atributos, modelo de PD, API e dashboard"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
vertice-pipeline = "vertice.pipeline.runner:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
src = ["src", "app"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905", "B008"]
